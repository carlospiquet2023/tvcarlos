# ============================================================
# Nginx — Configuração de Produção EduVault (10k+ alunos)
# ============================================================
#
# INSTALAÇÃO:
#   sudo apt install nginx
#   sudo cp nginx.conf /etc/nginx/sites-available/eduvault
#   sudo ln -s /etc/nginx/sites-available/eduvault /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (Let's Encrypt):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d seudominio.com.br
#
# NOTA: Se usar CloudFlare, descomente a seção "CloudFlare Real IP" abaixo
#
# ============================================================

# ========================================
# RATE LIMITING — Zonas (definidas FORA do server block)
# ========================================
# Zona geral: 30 req/s por IP (burst 60)
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# Zona de login: 5 req/min por IP (anti brute-force)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Zona de upload: 3 req/min por IP (uploads pesados)
limit_req_zone $binary_remote_addr zone=upload:10m rate=3r/m;

# Zona de API escrita (POST/PUT/DELETE): 15 req/s por IP
limit_req_zone $binary_remote_addr zone=api_write:10m rate=15r/s;

# Resposta customizada para rate limit (429 Too Many Requests)
limit_req_status 429;

# Pool de backends Node.js (PM2 cluster na porta 4000)
upstream eduvault_api {
    least_conn;                          # Distribui para o processo com menos conexões
    server 127.0.0.1:4000;
    keepalive 64;                        # Conexões keep-alive para o backend
}

# Redirecionar HTTP → HTTPS
server {
    listen 80;
    server_name seudominio.com.br;       # ← ALTERE para seu domínio
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name seudominio.com.br;       # ← ALTERE para seu domínio

    # ========================================
    # SSL (Certbot preenche automaticamente)
    # ========================================
    # ssl_certificate     /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ========================================
    # PERFORMANCE GLOBAL
    # ========================================
    client_max_body_size 550M;           # Upload de vídeo até 500MB + margem
    proxy_read_timeout 600s;             # FFmpeg pode demorar em reprocess
    proxy_send_timeout 600s;

    # Compressão gzip para API responses e frontend
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/vnd.apple.mpegurl;  # .m3u8 playlists

    # ========================================
    # FRONTEND (React build estático)
    # ========================================
    # Após 'npm run build' no frontend, copie dist/ para /var/www/eduvault/
    root /var/www/eduvault;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;    # SPA fallback (React Router)
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # Assets estáticos do frontend (JS, CSS, imagens) — cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ========================================
    # API — Proxy reverso para Node.js
    # ========================================
    location /api/ {
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://eduvault_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout para uploads grandes (vídeo)
        client_body_timeout 300s;
    }

    # Login — Rate limit severo (anti brute-force)
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;

        proxy_pass http://eduvault_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload de vídeo — Rate limit restritivo
    location /api/video/upload {
        limit_req zone=upload burst=2 nodelay;

        proxy_pass http://eduvault_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_body_timeout 300s;
    }

    # Health check — passthrough para Node
    location = / {
        proxy_pass http://eduvault_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ========================================
    # HLS STREAMING — Nginx serve direto do disco
    # Elimina ~70% de carga do Node.js
    # ========================================
    location /hls/ {
        alias /var/www/eduvault-data/uploads/hls/;    # ← ALTERE para o path absoluto dos HLS

        # Segmentos .ts são imutáveis — cache agressivo
        location ~* \.ts$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Robots-Tag "noindex";
            access_log off;
        }

        # Playlists .m3u8 — sem cache (adaptive bitrate precisa de fresh)
        location ~* \.m3u8$ {
            expires -1;
            add_header Cache-Control "no-cache";
            add_header X-Robots-Tag "noindex";
        }

        # Segurança: sem listagem de diretório
        autoindex off;

        # CORS para o player HLS.js
        add_header Access-Control-Allow-Origin "https://seudominio.com.br" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }

    # ========================================
    # IMAGENS — Nginx serve direto (thumbnails, logos, conteúdo)
    # ========================================
    location /uploads/images/ {
        alias /var/www/eduvault-data/uploads/images/;  # ← ALTERE para o path absoluto
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ========================================
    # PDFs — Proxy para Node (requer autenticação JWT)
    # ========================================
    location /uploads/pdfs/ {
        proxy_pass http://eduvault_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ========================================
    # SEGURANÇA
    # ========================================
    # Bloquear acesso a arquivos sensíveis
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    # Bloquear acesso direto ao mp4 original
    location /uploads/videos/ {
        deny all;
        return 403;
    }

    # Headers de segurança (complementa Helmet do Node)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========================================
    # CLOUDFLARE REAL IP (descomente se usar CloudFlare)
    # Sem isso, rate limiting vê o IP do CloudFlare, não do cliente
    # ========================================
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 141.101.64.0/18;
    # set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 190.93.240.0/20;
    # set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 197.234.240.0/22;
    # set_real_ip_from 198.41.128.0/17;
    # set_real_ip_from 162.158.0.0/15;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 131.0.72.0/22;
    # set_real_ip_from 2400:cb00::/32;
    # set_real_ip_from 2606:4700::/32;
    # set_real_ip_from 2803:f800::/32;
    # set_real_ip_from 2405:b500::/32;
    # set_real_ip_from 2405:8100::/32;
    # set_real_ip_from 2a06:98c0::/29;
    # set_real_ip_from 2c0f:f248::/32;
    # real_ip_header CF-Connecting-IP;

    # Logs
    access_log /var/log/nginx/eduvault-access.log;
    error_log  /var/log/nginx/eduvault-error.log warn;
}
