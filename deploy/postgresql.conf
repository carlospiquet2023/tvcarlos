# -------------------------------------------
# PostgreSQL — Tuning para 10k+ alunos
# -------------------------------------------
#
# Copiar para /etc/postgresql/16/main/conf.d/eduvault.conf
# ou adicionar ao postgresql.conf principal.
#
# Reiniciar após aplicar:
#   sudo systemctl restart postgresql
#
# Baseado em servidor com 4GB RAM e SSD.
# Para 8GB+, dobre shared_buffers e effective_cache_size.
# -------------------------------------------

# ============== CONEXÕES ==============
max_connections = 200               # PM2 cluster (8 procs × 10 pool) + worker + admin
superuser_reserved_connections = 3

# ============== MEMÓRIA ==============
shared_buffers = 1GB                # 25% da RAM total (4GB)
effective_cache_size = 3GB          # 75% da RAM total
work_mem = 8MB                      # Sorts/hashes por operação (cuidado: × conexões)
maintenance_work_mem = 256MB        # VACUUM, CREATE INDEX, ALTER TABLE
wal_buffers = 64MB
huge_pages = try

# ============== WAL / CHECKPOINT ==============
wal_level = replica                 # Necessário p/ replicação e backup PITR
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# ============== QUERY PLANNER ==============
random_page_cost = 1.1              # SSD (default 4.0 é para HDD)
effective_io_concurrency = 200      # SSD
default_statistics_target = 100

# ============== LOGGING ==============
log_min_duration_statement = 500    # Log queries > 500ms (slow query log)
log_checkpoints = on
log_connections = off               # Muitas conexões em produção, evitar spam
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# ============== AUTOVACUUM ==============
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s            # Mais frequente para tabelas ativas
autovacuum_vacuum_cost_delay = 2ms

# ============== SEGURANÇA ==============
password_encryption = scram-sha-256
ssl = on
