# ============================================================
# Uptime Kuma — Monitoramento de Disponibilidade (Self-Hosted)
# ============================================================
#
# INSTALAÇÃO:
#   cd deploy/
#   docker compose -f docker-compose.monitoring.yml up -d
#
# ACESSO:
#   http://SEU_IP:3001 (primeiro acesso cria conta admin)
#
# O QUE MONITORAR (configurar na UI):
#   1. Health Check:      GET https://seudominio.com.br/         (esperar 200)
#   2. API Login:         GET https://seudominio.com.br/api/auth (esperar 401 = Node vivo)
#   3. Config Público:    GET https://seudominio.com.br/api/config/public (esperar 200)
#   4. HLS Disponível:    GET https://seudominio.com.br/hls/     (esperar algo != 502)
#   5. Métricas:          GET https://seudominio.com.br/api/metrics (esperar 200)
#   6. PostgreSQL:        TCP ping em localhost:5432
#   7. Certificado SSL:   HTTPS monitor (alerta 14 dias antes de expirar)
#
# ALERTAS RECOMENDADOS:
#   - Telegram Bot (gratuito, notificação instantânea)
#   - Discord Webhook (se usar Discord)
#   - Email via SMTP (backup)
#
# INTERVALO: 60 segundos para Health Check, 300s para os demais
#
# ============================================================

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: eduvault-monitor
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    environment:
      - TZ=America/Sao_Paulo

volumes:
  uptime-kuma-data:
    driver: local
