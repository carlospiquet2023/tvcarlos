include /etc/nginx/modules/*.conf;

worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

rtmp {
    # O log RTMP inclui argumentos de publicação em algumas versões. Mantê-lo
    # desligado evita registrar o token enviado pelo OBS/streamer.
    access_log off;

    server {
        listen 1935;
        chunk_size 4096;
        ping 30s;
        ping_timeout 10s;
        max_message 8M;

        application live {
            live on;
            record off;
            idle_streams off;
            drop_idle_publisher 10s;

            notify_method post;
            # O notify entra por loopback e o proxy HTTP resolve o backend pelo
            # DNS interno do Docker a cada TTL. Assim, recriar a API não deixa
            # o worker RTMP preso ao IP anterior.
            on_publish http://127.0.0.1:8081/authorize;

            hls on;
            hls_path /var/cache/nginx/hls;
            hls_fragment 2s;
            hls_playlist_length 12s;
            hls_cleanup on;
            hls_continuous off;
            hls_nested off;
        }
    }
}

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    default_type application/octet-stream;
    include /etc/nginx/mime.types;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 20s;

    # Endpoint exclusivo de loopback usado pelo callback RTMP. A variável no
    # proxy_pass força resolução dinâmica pelo DNS embutido do Docker.
    server {
        listen 127.0.0.1:8081;
        server_name _;

        location = /authorize {
            access_log off;
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $broadcast_backend http://backend:4000;
            proxy_pass $broadcast_backend/internal/broadcast/authorize;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host backend;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080;
        server_name _;

        location = /health/live {
            access_log off;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"ok"}';
        }

        location = /status {
            access_log off;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;

            set $live_status false;
            set $loop_status false;
            if (-f /var/cache/nginx/hls/stream.m3u8) {
                set $live_status true;
            }
            if (-f /var/cache/nginx/hls/loop.m3u8) {
                set $loop_status true;
            }

            return 200 '{"live":$live_status,"loop":$loop_status}';
        }

        # Consumido somente pelo backend na rede interna. O frontend bloqueia
        # explicitamente /broadcast/stat para não expor telemetria RTMP.
        location = /stat {
            access_log off;
            rtmp_stat all;
        }

        location /hls/ {
            alias /var/cache/nginx/hls/;
            autoindex off;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Robots-Tag "noindex" always;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        location / {
            return 404;
        }
    }
}
