x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-container-hardening: &container-hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  uploads-init:
    image: alpine:3.22
    user: "0:0"
    command:
      - sh
      - -ec
      - >-
        mkdir -p /uploads/videos /uploads/hls /uploads/images /uploads/pdfs;
        chown 1000:1000 /uploads /uploads/videos /uploads/hls /uploads/images /uploads/pdfs
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - eduvault_uploads_prod:/uploads
    restart: "no"
    logging: *default-logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduvault}
      POSTGRES_USER: ${POSTGRES_USER:-eduvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no ambiente de produção}
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - eduvault-prod-net
    logging: *default-logging

  backend:
    <<: *container-hardening
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      uploads-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    expose:
      - "4000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL com a senha percent-encoded no ambiente de produção}
      MIGRATION_MODE: deploy
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no ambiente de produção}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      AUTH_TTL_HOURS: ${AUTH_TTL_HOURS:-8}
      PORT: 4000
      NODE_ENV: production
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL no ambiente de produção}
      VIDEO_STORAGE_PATH: /app/uploads/videos
      HLS_STORAGE_PATH: /app/uploads/hls
      IMAGE_STORAGE_PATH: /app/uploads/images
      PDF_STORAGE_PATH: /app/uploads/pdfs
      PGBOSS_WORKER: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      PLATFORM_NAME: ${PLATFORM_NAME:-EduVault}
      SEED_ON_START: "false"
      BROADCAST_INTERNAL_URL: http://broadcast:8080
      RTMP_STREAM_KEY: ${RTMP_STREAM_KEY:?defina RTMP_STREAM_KEY no ambiente de produção}
      LOOP_STREAM_KEY: ${LOOP_STREAM_KEY:?defina LOOP_STREAM_KEY no ambiente de produção}
      GROQ_API_KEY: ${GROQ_API_KEY:?defina uma GROQ_API_KEY nova e rotacionada no ambiente de produção}
      GROQ_MODEL: ${GROQ_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      GROQ_FALLBACK_MODEL: ${GROQ_FALLBACK_MODEL:-openai/gpt-oss-120b}
      GROQ_MODEL_SWITCH_AT: ${GROQ_MODEL_SWITCH_AT:-2026-07-17T00:00:00.000Z}
      GROQ_TIMEOUT_MS: ${GROQ_TIMEOUT_MS:-20000}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-1200}
      AI_RATE_LIMIT_MAX: ${AI_RATE_LIMIT_MAX:-20}
      AI_RATE_LIMIT_WINDOW_MS: ${AI_RATE_LIMIT_WINDOW_MS:-900000}
    volumes:
      - eduvault_uploads_prod:/app/uploads
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');http.get('http://127.0.0.1:4000/health/ready',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 45s
    networks:
      - eduvault-prod-net
      - broadcast-prod-net
    logging: *default-logging

  video-worker:
    <<: *container-hardening
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      uploads-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL com a senha percent-encoded no ambiente de produção}
      NODE_ENV: production
      PROCESS_ROLE: worker
      RUN_MIGRATIONS: "false"
      VIDEO_STORAGE_PATH: /app/uploads/videos
      HLS_STORAGE_PATH: /app/uploads/hls
    volumes:
      - eduvault_uploads_prod:/app/uploads
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 45s
    networks:
      - eduvault-prod-net
    logging: *default-logging

  broadcast:
    <<: *container-hardening
    build:
      context: ./broadcast
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${RTMP_BIND_ADDRESS:-127.0.0.1}:${RTMP_PORT:-1935}:1935"
    expose:
      - "8080"
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx/hls:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    stop_grace_period: 15s
    networks:
      - broadcast-prod-net
      - broadcast-edge-prod-net
    logging: *default-logging

  broadcast-loop:
    <<: *container-hardening
    profiles: ["broadcast-loop"]
    build:
      context: ./broadcast
      dockerfile: Dockerfile.streamer
    init: false
    restart: unless-stopped
    depends_on:
      broadcast:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    environment:
      LOOP_STREAM_KEY: ${LOOP_STREAM_KEY:?defina LOOP_STREAM_KEY no ambiente de produção}
      VIDEO_DIRECTORY: /media/videos
      PLAYLIST_FILE: /playlists/playlist.txt
      RTMP_HOST: broadcast
      RTMP_PORT: 1935
      RTMP_APPLICATION: live
      LOOP_STREAM_NAME: loop
      BROADCAST_HEALTH_URL: http://broadcast:8080/health/live
    volumes:
      - eduvault_uploads_prod:/media:ro
      - ./broadcast/playlist.txt:/playlists/playlist.txt:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 20s
    networks:
      - broadcast-prod-net
    logging: *default-logging

  frontend:
    <<: *container-hardening
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        NGINX_CONF: nginx.prod.conf
        LISTEN_PORT: "8080"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      broadcast:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080"
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=64m,mode=1777
      - /var/run:size=1m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 15s
    networks:
      - eduvault-prod-net
      - broadcast-prod-net
    logging: *default-logging

volumes:
  postgres_data_prod:
  eduvault_uploads_prod:

networks:
  eduvault-prod-net:
  broadcast-prod-net:
    internal: true
  broadcast-edge-prod-net:
