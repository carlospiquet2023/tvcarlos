<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduVault - Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(92vw, 520px);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 14px;
      padding: 1.2rem;
      text-align: center;
    }
    h1 { margin: 0 0 0.5rem 0; font-size: 1.3rem; }
    p { margin: 0; color: #cbd5e1; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Você está offline</h1>
    <p>Conecte-se à internet para continuar assistindo as aulas e sincronizar progresso.</p>
  </main>
</body>
</html>
