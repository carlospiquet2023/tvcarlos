name: Staging E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL pública do frontend em staging
        required: false
        type: string
      api_url:
        description: URL pública da API em staging (use a URL do frontend se houver proxy reverso)
        required: false
        type: string
  schedule:
    - cron: "47 6 * * 1"

permissions:
  contents: read

concurrency:
  group: staging-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  critical-journeys:
    name: Critical journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CI: true
      E2E_BASE_URL: ${{ inputs.base_url || secrets.STAGING_BASE_URL }}
      E2E_API_URL: ${{ inputs.api_url || secrets.STAGING_API_URL }}
      E2E_REQUIRE_ADMIN: true
      E2E_ADMIN_LOGIN: ${{ secrets.E2E_ADMIN_LOGIN }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_STUDENT_LOGIN: ${{ secrets.E2E_STUDENT_LOGIN }}
      E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
      E2E_ARTIFACTS_DIR: ${{ runner.temp }}/playwright-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install E2E dependencies
        run: npm ci

      - name: Require staging URLs
        shell: bash
        run: |
          if [[ -z "$E2E_BASE_URL" || -z "$E2E_API_URL" ]]; then
            echo "E2E_BASE_URL and E2E_API_URL must be configured as inputs or staging secrets." >&2
            exit 2
          fi

      - name: Install Chromium
        run: npm run test:e2e:install

      - name: Run critical journeys
        run: npm run test:e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/playwright-artifacts
          if-no-files-found: ignore
          retention-days: 7
