openapi: 3.1.0
info:
  title: Escola 360 API
  version: 1.0.0
  description: API versionada do sistema operacional escolar. Todas as mutações são autenticadas, autorizadas por organização e auditadas.
servers:
  - url: /api/v1/school
security:
  - cookieSession: []
paths:
  /organizations:
    get:
      summary: Lista instituições visíveis para o usuário
      tags: [Instituições]
      responses:
        '200': { description: Lista paginável de instituições }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /organizations/setup:
    post:
      summary: Configura instituição, unidade principal, ano e períodos em transação única
      tags: [Configuração]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationSetup' }
      responses:
        '201': { description: Instituição criada }
        '409': { description: Slug ou identificador duplicado }
  /organizations/{organizationId}/bootstrap:
    get:
      summary: Retorna estrutura necessária para o painel escolar
      tags: [Instituições]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses:
        '200': { description: Unidades, períodos, disciplinas, turmas e memberships }
        '403': { $ref: '#/components/responses/Forbidden' }
  /organizations/{organizationId}/overview:
    get:
      summary: Indicadores operacionais do dia
      tags: [Analytics]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses:
        '200': { description: Contadores de operação e intervenção }
  /organizations/{organizationId}/data-quality:
    get:
      summary: Mede completude e prontidão cadastral para operação e Educacenso
      tags: [Governança de dados]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: Score e verificações de qualidade por severidade } }
  /organizations/{organizationId}/analytics/student-risk:
    get:
      summary: Radar explicável de permanência com frequência, desempenho e intervenções
      description: Indicador de apoio auditado; não toma decisões acadêmicas, disciplinares ou diagnósticas.
      tags: [Analytics]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses:
        '200': { description: Estudantes priorizados, fatores, evidências e ação sugerida }
        '403': { description: Restrito a direção, coordenação e orientação }
  /organizations/{organizationId}/campuses:
    post:
      summary: Cria unidade escolar
      tags: [Estrutura]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '201': { description: Unidade criada } }
  /organizations/{organizationId}/academic-years:
    post:
      summary: Cria ano e períodos letivos sem sobreposição
      tags: [Estrutura]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '201': { description: Ano letivo criado } }
  /organizations/{organizationId}/subjects:
    post:
      summary: Cria disciplina do catálogo curricular
      tags: [Currículo]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '201': { description: Disciplina criada } }
  /organizations/{organizationId}/competencies:
    post:
      summary: Cria competência curricular/BNCC hierárquica
      tags: [Currículo]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '201': { description: Competência criada } }
  /organizations/{organizationId}/memberships:
    post:
      summary: Cria ou atualiza papel institucional do usuário
      tags: [Pessoas]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '201': { description: Membership salvo } }
  /organizations/{organizationId}/people:
    post:
      summary: Cria pessoa com senha temporária e vínculo/matrícula opcional
      description: A conta exige troca de senha no primeiro acesso. Administrador global não pode ser criado por este recurso.
      tags: [Pessoas]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses:
        '201': { description: Pessoa criada }
        '409': { description: E-mail já cadastrado }
  /organizations/{organizationId}/guardian-links:
    post:
      summary: Vincula responsável ao estudante
      tags: [Pessoas]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '201': { description: Vínculo salvo } }
  /organizations/{organizationId}/classes:
    post:
      summary: Cria turma no ano letivo e unidade
      tags: [Acadêmico]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '201': { description: Turma criada } }
  /organizations/{organizationId}/classes/{classId}/roster:
    get:
      summary: Retorna roster, ofertas, docentes e horários da turma
      tags: [Acadêmico]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/ClassId' }
      responses: { '200': { description: Roster da turma } }
  /organizations/{organizationId}/classes/{classId}/workspace:
    get:
      summary: Retorna diário, avaliações, roster e matriz para o espaço operacional da turma
      tags: [Acadêmico]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/ClassId' }
      responses:
        '200': { description: Espaço completo da turma }
        '403': { description: Professor não atribuído à turma }
  /organizations/{organizationId}/classes/{classId}/enrollments:
    post:
      summary: Matricula estudante na turma
      tags: [Acadêmico]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/ClassId' }
      responses: { '201': { description: Matrícula ativa } }
  /organizations/{organizationId}/classes/{classId}/offerings:
    post:
      summary: Atribui disciplina e professor à turma
      tags: [Acadêmico]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/ClassId' }
      responses: { '201': { description: Oferta criada ou atualizada } }
  /offerings/{offeringId}/timetable:
    put:
      summary: Substitui grade horária da oferta
      tags: [Horários]
      parameters: [{ $ref: '#/components/parameters/OfferingId' }]
      responses: { '200': { description: Grade horária atualizada } }
  /offerings/{offeringId}/sessions:
    post:
      summary: Abre sessão do diário de classe
      tags: [Diário]
      parameters: [{ $ref: '#/components/parameters/OfferingId' }]
      responses: { '201': { description: Sessão criada } }
  /sessions/{sessionId}/attendance:
    put:
      summary: Registra chamada em lote e conclui a sessão
      tags: [Diário]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Frequência registrada } }
  /offerings/{offeringId}/assessments:
    post:
      summary: Cria instrumento de avaliação
      tags: [Avaliação]
      parameters: [{ $ref: '#/components/parameters/OfferingId' }]
      responses: { '201': { description: Avaliação criada } }
  /assessments/{assessmentId}/grades:
    put:
      summary: Registra notas e feedback em lote
      tags: [Avaliação]
      parameters: [{ name: assessmentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Notas processadas } }
  /organizations/{organizationId}/interventions:
    post:
      summary: Abre plano de intervenção e permanência
      tags: [Permanência]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '201': { description: Intervenção criada } }
  /organizations/{organizationId}/events:
    post:
      summary: Cria evento institucional, de unidade ou turma
      tags: [Calendário]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '201': { description: Evento criado } }
  /me/academic:
    get:
      summary: Retorna visão acadêmica do estudante, responsável ou docente autenticado
      tags: [Portal]
      responses: { '200': { description: Vínculos acadêmicos do usuário } }
  /me/family:
    get:
      summary: Retorna somente dependentes legalmente vinculados, notas publicadas, frequência, agenda e horários
      tags: [Portal]
      responses:
        '200': { description: Visão consolidada da família }
        '403': { description: Perfil não é responsável }
  /integrations/oneroster/v1p2/organizations/{organizationId}/roster:
    get:
      summary: Exporta roster em perfil JSON alinhado ao OneRoster 1.2
      description: Exportação versionada e auditada. Não representa certificação oficial 1EdTech.
      tags: [Interoperabilidade]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: Organizações, sessões acadêmicas, cursos, classes, usuários e matrículas } }
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: eduvault_session
  parameters:
    OrganizationId: { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    ClassId: { name: classId, in: path, required: true, schema: { type: string, format: uuid } }
    OfferingId: { name: offeringId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Unauthorized: { description: Sessão ausente, inválida ou expirada }
    Forbidden: { description: Membership ou papel insuficiente }
  schemas:
    OrganizationSetup:
      type: object
      required: [name, slug, campus, academicYear]
      properties:
        name: { type: string, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        legalName: { type: string }
        inepCode: { type: string }
        timezone: { type: string, default: America/Sao_Paulo }
        campus:
          type: object
          required: [code, name]
          properties:
            code: { type: string }
            name: { type: string }
            inepCode: { type: string }
        academicYear:
          type: object
          required: [name, startDate, endDate, terms]
          properties:
            name: { type: string }
            startDate: { type: string, format: date }
            endDate: { type: string, format: date }
            terms:
              type: array
              minItems: 1
              maxItems: 12
              items:
                type: object
                required: [name, startDate, endDate]
                properties:
                  name: { type: string }
                  startDate: { type: string, format: date }
                  endDate: { type: string, format: date }
